    <style>
      @import url("https://fonts.googleapis.com/css2?family=VT323&display=swap");
      :root {
        --c-accent: #8957ff; /* main character, titles, highlights */
        --c-accent-dim: #b05a40; /* accent but muted */
        --c-npc-conv: #7a8aaa; /* default NPC dialogue box color */
        --c-win: #4aba6a; /* recruitment success */
        --c-warn: #d4a030; /* heat, warnings */
        --c-info: #5cbdbd; /* info banners, fridge */
        --c-narc: #c44; /* narc reveal */
        --c-bg: #000000; /* game background */
        --c-bg-hud: #1a1a1a; /* hud background */
        --c-text-dim: #888; /* muted text */
        --c-text-mid: #aaa; /* medium text */
        --c-sidewalk: #444; /* road borders */
        --c-road-dot: #333; /* subtle road texture */
        --c-bldg-1: #3a3535; /* building palette — very desaturated */
        --c-bldg-2: #353a35;
        --c-bldg-3: #35353a;
        --c-bldg-4: #3a3838;
        --c-bldg-5: #383a38;
        --c-bldg-6: #38383a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--c-bg);
        color: var(--c-bg);
        font-family: "VT323", "Courier New", monospace;
        overflow: hidden;
        height: 100vh; /* fallback for browsers that reject dvh (e.g. FB in-app browser) — dvh below overrides where supported */
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        user-select: none;
        -webkit-user-select: none;
      }
      #fb-hint {
        width: 100%;
        max-width: 1200px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: max(7px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 7px max(16px, env(safe-area-inset-left));
        font-family: "Courier New", "Consolas", "Monaco", monospace;
        font-size: 13px;
        letter-spacing: 0.2px;
        text-align: center;
        color: var(--c-info);
        background: rgba(92, 189, 189, 0.08);
        border-bottom: 1px solid rgba(92, 189, 189, 0.25);
      }
      #fb-hint.hidden {
        display: none;
      }
      #fb-hint-close {
        flex-shrink: 0;
        background: transparent;
        border: 1px solid rgba(92, 189, 189, 0.4);
        color: var(--c-info);
        width: 20px;
        height: 20px;
        line-height: 1;
        border-radius: 2px;
        cursor: pointer;
        font-size: 14px;
      }
      #hud {
        width: 100%;
        max-width: 1200px;
        /* Clears notches/status bars */
        padding: max(6px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
        gap: 10px;
        font-size: 22px;
        letter-spacing: 2px;
        color: var(--c-text-mid);
        z-index: 10;
        flex-shrink: 0;
        background: transparent;
        border-bottom: 1px solid #2a2a2a;
        box-shadow: 0 1px 0 rgba(137, 87, 255, 0.15);
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-transform: lowercase;
      }

      #button-div {
        display: flex;
        padding-left: 10px;
      }


      /* Help modal overlay */
      #help-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999;
        justify-content: center;
        align-items: center;
      }
      #help-overlay.open {
        display: flex;
      }

      /* Help modal box */
      #help-modal {
        background: #0d0d0d;
        border: 1px solid #2a2a2a;
        box-shadow: 0 0 0 1px rgba(137, 87, 255, 0.15);
        padding: 28px 32px;
        max-width: 360px;
        width: 90%;
        color: var(--c-text-mid);
        font-family: inherit;
        font-size: 16px;
        letter-spacing: 1px;
        line-height: 1.7;
        text-transform: lowercase;
      }
      #help-modal h2 {
        color: #ccc;
        margin: 0 0 16px;
        font-size: 2.5rem;
        font-variant: small-caps;
        letter-spacing: 2px;
        border-bottom: 1px solid #2a2a2a;
        padding-bottom: 8px;
      }
      #help-modal p {
        margin: 0 0 8px;
        color: #666;
      }
      #help-modal strong {
        color: #888;
      }
      #help-modal a {
        color: var(--c-accent);
        text-decoration: none;
      }
      #help-modal a:hover {
        color: #ccc;
      }

      /* Mobile */
      @media (max-width: 700px) {
        #hud .seg {
          flex-direction: column;
          gap: 0;
          margin-right: 0;
          align-items: flex-start;
          line-height: 1.25;
        }

        #hud > span:first-child {
          flex: 1;
          min-width: 0;
        }
        #hud-label {
          display: flex;
          flex: 1;
          justify-content: space-between;
        }
        .hud-btn,
        #help-btn,
        #mute-btn,
        #lang-btn,
        #quit-btn {
         
          font-size: inherit; /* EXACTLY the stats' size — inherits from #hud */
          font-variant: normal;
          text-transform: lowercase;
          letter-spacing: 1px;
          height: 2.5em; /* = two stat rows at 1.25 line-height */
          display: inline-flex;
          align-items: center;
          padding: 0 7px;
          margin-left: 0; /* #button-div gap handles spacing */
        }
        #music-vol {
          flex-direction: column;
          line-height: 1.05;
          gap: 0;
        }
        #button-div {
          gap: 8px;
          padding-left: 6px;
        }
      }
      @media (max-width: 480px) {
        #music-slider {
          width: 50px;
        }
        #hud {
          font-size: 14px;
          padding: 4px 8px;
          gap: 6px;
          letter-spacing: 1px;
        }
        #hud .status {
          font-size: 14px;
        }

        #help-modal {
          font-size: 14px;
          padding: 20px;
        }
      }

      .hud-btn,
      #help-btn,
      #mute-btn,
      #lang-btn,
      #quit-btn {
        background: none;
        border: 1px solid #444;
        color: #5cbdbd;
        font-size: 1.3rem;
        letter-spacing: 2px;
        cursor: pointer;
        padding: 2px 10px;
        border-radius: 0;
        font-family: inherit;
        font-variant: small-caps;
        letter-spacing: 1px;
        flex-shrink: 0;
        margin-left: 6px;
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .hud-btn:hover,
      #help-btn:hover,
      #mute-btn:hover,
      #lang-btn:hover,
      #quit-btn:hover {
        border-color: var(--c-accent);
        color: #ccc;
      }

      @media (max-width: 480px) {
        #hud {
          font-size: 14px;
          padding: 4px 8px;
          letter-spacing: 1px;
        }
        .hud-btn,
        #help-btn,
        #mute-btn,
        #lang-btn,
        #quit-btn {
     
          font-variant: normal;
          text-transform: lowercase;
          letter-spacing: 1px;
          height: 2.5em; /* = two stat rows at 1.25 line-height */
          display: inline-flex;
          align-items: center;
          padding: 0 7px;
          margin-left: 0; /* #button-div gap handles spacing */
        }
        #music-vol {
          flex-direction: column;
          line-height: 1.05;
          gap: 0;
        }
        #button-div {
          gap: 8px;
          padding-left: 6px;
        }
      }

      #scene-nav {
        width: 100%;
        max-width: 1200px;
        display: flex;
        gap: 3px;
        padding: 3px 10px;
        background: #0d0d0d;
        border-bottom: 1px solid #1a1a1a;
        flex-shrink: 0;
        display: none;
      }
      #scene-nav button {
        flex: 1;
        font-family: "VT323", monospace;
        font-size: 16px;
        background: #111;
        color: #444;
        border: 1px solid #2a2a2a;
        padding: 3px 0;
        cursor: pointer;
        border-radius: 2px;
        touch-action: manipulation;
      }
      #scene-nav button:hover,
      #scene-nav button:active {
        color: #aaa;
        border-color: #555;
        background: #222;
      }

      .flash-gold {
        animation: flashGold 300ms ease-out;
      }
      @keyframes flashGold {
        0% {
          filter: brightness(1.8) saturate(1.5);
        }
        100% {
          filter: brightness(1) saturate(1);
        }
      }

      /* .flash-gold { background: gold !important; color: black !important; } */

      #game-screen.chroma {
        animation: chroma-pulse 0.13s steps(1) infinite;
      }
      @keyframes chroma-pulse {
        0% {
          text-shadow:
            3px 0 rgba(255, 40, 60, 0.65),
            -3px 0 rgba(0, 180, 255, 0.65);
        }
        50% {
          text-shadow:
            -2px 0 rgba(255, 40, 60, 0.5),
            2px 0 rgba(0, 180, 255, 0.5);
        }
        100% {
          text-shadow:
            3px 0 rgba(255, 40, 60, 0.65),
            -3px 0 rgba(0, 180, 255, 0.65);
        }
      }

      #game-screen.flash-good {
        animation: flash-good 0.35s ease-out forwards;
      }
      @keyframes flash-good {
        0% {
          box-shadow: inset 0 0 0 1px rgba(17, 37, 37, 0.1);
        }
        60% {
          box-shadow: inset 0 0 0 2px rgba(24, 43, 43, 0.1);
        }
        100% {
          box-shadow: inset 0 0 0 0px rgba(92, 189, 189, 0);
        }
      }
      #game-screen.flash-gold {
        animation: flash-gold 0.3s ease-out forwards;
      }
      @keyframes flash-gold {
        0% {
          box-shadow: inset 0 0 0 3px rgba(20, 14, 8, 0.1);
        }
        100% {
          box-shadow: inset 0 0 0 0px rgba(29, 19, 10, 0);
        }
      }

      #hud .val {
        color: var(--c-accent);

        letter-spacing: 1px;
      }
      
      #hud > span,
      #hud .status {
        white-space: nowrap;
      }
      #hud .seg {
        display: inline-flex;
        flex-direction: row;
        align-items: baseline;
        gap: 6px;
        margin-right: 16px;
      }
  
      body.is-mobile #hud .seg {
        flex-direction: column;
        gap: 0;
        margin-right: 0;
        align-items: flex-start;
        line-height: 1.25;
      }
      body.is-mobile #hud > span:first-child {
        flex: 1;
        min-width: 0;
      }
      body.is-mobile #hud-label {
        display: flex;
        flex: 1;
        justify-content: space-between;
      }
      body.is-mobile .hud-btn,
      body.is-mobile #help-btn,
      body.is-mobile #mute-btn,
      body.is-mobile #lang-btn,
      body.is-mobile #quit-btn {
       
        font-size: inherit; /* EXACTLY the stats' size — inherits from #hud */
        font-variant: normal;
        text-transform: lowercase;
        letter-spacing: 1px;
        height: 2.5em; /* = two stat rows at 1.25 line-height */
        display: inline-flex;
        align-items: center;
        padding: 0 7px;
        margin-left: 0; /* #button-div gap handles spacing */
      }
      body.is-mobile #music-vol {
        flex-direction: column;
        line-height: 1.05;
        gap: 0;
      }
      body.is-mobile #button-div {
        gap: 8px;
        padding-left: 6px;
      }
      #hud .status {
        color: #4ecc4e; /* matches GAME_DATA.colors.success — old #2a7a2a was unreadable */
        text-align: right;
        /* font-size: 22px; */
        opacity: 0.9;
      }
      #game-wrap {
        width: 100%;
        max-width: 1200px;
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #000000;
        /* Grid is sized to its exact W×H cell content in JS (measureGrid) —
           on screens taller/shorter than that content, center it in the
           leftover space rather than pinning it to the top-left. */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-screen {
        font-family: "Courier New", "Consolas", "Monaco", monospace;
        font-variant-ligatures: none;
        font-feature-settings:
          "liga" 0,
          "calt" 0;
        text-rendering: geometricPrecision;
        letter-spacing: 0;
        word-spacing: 0;
        white-space: pre;
        line-height: 1;
        background: #000000;
        overflow: hidden;
        padding: 0;
        margin: 0;
        position: relative;
        flex: none;
        cursor: pointer;
      }
      #game-screen .cell {
        display: inline-block;
        width: 1ch;
        overflow: visible;
        vertical-align: top;
      }

      #game-screen .cell {
        display: inline-block;
        width: 1ch;
        text-align: left;
        overflow: visible;
        white-space: pre;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0c0a0c 0%, #050505 100%);
        z-index: 20;
        text-align: center;
        gap: 14px;
        font-family: "VT323", monospace;
        padding: 20px;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay h1 {
        font-size: 52px;
        color: var(--c-accent);
        letter-spacing: 6px;
        margin: 0;
        animation: titlepulse 3s ease-in-out infinite, titleglitch 0.9s ease-out 1;
      }
      @keyframes titlepulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.82;
        }
      }
      @keyframes titleglitch {
        0%   { text-shadow: 5px 0 rgba(255,40,60,0.85), -5px 0 rgba(0,180,255,0.85); }
        40%  { text-shadow: 2px 0 rgba(255,40,60,0.4),  -2px 0 rgba(0,180,255,0.4); }
        100% { text-shadow: none; }
      }
      #overlay .sub {
        font-size: 1.5rem;
        color: var(--c-npc-conv);
        max-width: 440px;
        line-height: 1.5;
        white-space: pre-line;
        /* font-style: italic; */
        opacity: 0.9;
      }
      #overlay .endart {
        font-size: 28px;
        line-height: 1.1;
        font-family: "Courier New", monospace;
        white-space: pre;
        margin: 10px 0;
        color: var(--c-accent);
        text-align: center;
        width: 100%;
        /* text-shadow: 0 0 12px rgba(137, 87, 255, 0.6); */
        animation: artblink 1.2s ease-in-out infinite;
      }
      @keyframes artblink {
        0%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
        50% {
          opacity: 0.7;
          transform: translateY(-2px);
        }
      }
      #start-btn {
        margin-top: 16px;
        padding: 14px 52px;
        color: #fff;
        background: transparent;
        border: 2px solid var(--c-accent);
        font-family: "VT323", monospace;
        font-size: 28px;
        cursor: pointer;
        letter-spacing: 4px;
        border-radius: 2px;
        transition: all 0.2s ease;
      }
      #start-btn:hover {
        background: var(--c-accent);
        color: #fff;
        transform: scale(1.03);
      }
      #overlay .hint {
        font-size: 17px;
        color: #7a7a8a;
        max-width: 380px;
        line-height: 1.5;
        opacity: 0.8;
      }

      /* Landing screen: show content on the ASCII grid, not as HTML */
      #overlay.grid-landing {
        background: transparent;
        pointer-events: none;
      }
      #overlay.grid-landing #start-btn {
        pointer-events: auto;
      }
      #overlay.grid-landing h1,
      #overlay.grid-landing .endart,
      #overlay.grid-landing .sub,
      #overlay.grid-landing .hint {
        display: none;
      }
      /* The visible "[ PLAY ]" box is drawn directly on the grid — this
         element is only the click/tap/keyboard hit target, sized and
         positioned by JS (_positionStartBtn) to sit exactly over it. */
      #overlay.grid-landing #start-btn {
        position: absolute;
        bottom: 60px; /* fallback until JS positions it over the grid box */
        left: 50%;
        margin-top: 0;
        padding: 0;
        background: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
        color: transparent;
        font-size: 1px;
      }
      #overlay.grid-landing #start-btn:hover {
        background: none;
      }
    </style>
