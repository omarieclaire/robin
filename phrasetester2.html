<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tag walker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #fff;
        --bg-soft: #fafafa;
        --bg-card: #fff;
        --ink: #1a1f36;
        --ink-soft: #4f566b;
        --ink-faint: #8792a2;
        --ink-ghost: #b8c0cc;
        --rule: #e6e9ee;
        --rule-soft: #f0f2f5;
        --accent: #635bff;
        --green: #1f7a4d;
        --green-bg: #ecf7f1;
        --green-line: #cce5d8;
        --amber: #8a6d1d;
        --amber-bg: #fbf6e8;
        --amber-line: #ead9a6;
        --rose: #b13a3a;
        --rose-bg: #fbeeee;
        --rose-line: #ecc9c9;
        --teal: #156877;
        --teal-bg: #e9f4f6;
        --teal-line: #b6dde2;
        --serif: "Iowan Old Style", "Charter", "Georgia", serif;
        --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
        --mono: "SF Mono", "Menlo", "Consolas", monospace;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 3.5;
        padding: 0 0 80px;
        -webkit-font-smoothing: antialiased;
      }

      .ctrl-wrap {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        padding: 14px 20px 10px;
        border-bottom: 1px solid var(--rule);
      }
      h1 {
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.01em;
        margin-bottom: 10px;
      }
      h1 .sub {
        color: var(--ink-faint);
        margin-left: 8px;
        font-size: 12px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls .sep {
        width: 1px;
        height: 22px;
        background: var(--rule);
        margin: 0 2px;
      }
      .controls .pos {
        color: var(--ink-faint);
        font-size: 11px;
        font-family: var(--mono);
      }
      .controls .pills {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      select {
        background: var(--bg-card);
        border: 1px solid var(--rule);
        color: var(--ink);
        padding: 6px 9px;
        font-family: inherit;
        font-size: 12px;
        border-radius: 5px;
        outline: none;
        min-width: 120px;
        cursor: pointer;
      }
      select:focus {
        border-color: var(--accent);
      }
      button {
        background: var(--ink);
        border: 1px solid var(--ink);
        color: #fff;
        padding: 6px 11px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        border-radius: 5px;
        cursor: pointer;
        transition: background 120ms;
      }
      button:hover {
        background: #2d3548;
      }
  
      button.sec {
        background: var(--bg-card);
        border: 1px solid var(--rule);
        color: var(--ink);
      }
      button.sec:hover {
        background: var(--bg-soft);
        border-color: var(--ink-ghost);
      }
      button.export-btn {
        background: var(--teal-bg);
        border: 1px solid var(--teal-line);
        color: var(--teal);
      }
      button.export-btn:hover {
        background: var(--teal-line);
      }

      #resetBtn {
        background-color: rgba(214, 57, 57, 0.207);
      }

      .tag-hdr {
        padding: 16px 20px 0;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .tag-hdr .lbl {
        color: var(--ink-faint);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .tag-hdr .name {
        color: var(--ink);
        font-family: var(--serif);
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .tag-hdr .avail {
        color: var(--ink-soft);
        font-size: 12px;
        font-style: italic;
        font-family: var(--serif);
      }
      .tag-hdr .pos {
        color: var(--ink-faint);
        font-size: 11px;
        font-family: var(--mono);
        margin-left: auto;
      }

      .npc-row {
        padding: 6px 20px 14px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .pill {
        padding: 4px 10px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        color: var(--ink-soft);
        background: var(--bg-card);
        font-size: 11px;
        line-height: 1;
        user-select: none;
      }
      .pill.active {
        color: #fff;
        border-color: var(--ink);
        background: var(--ink);
      }
      .pill.disabled {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .hint {
        margin-left: auto;
        color: var(--ink-faint);
        font-size: 10px;
        font-family: var(--mono);
      }

      #canvas-wrap {
        padding: 0 20px 40px;
        overflow-x: auto;
        display: flex;
        justify-content: center;
      }
      #tree-area {
        position: relative;
      }

      .card {
        position: absolute;
        background: var(--bg-card);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow:
          0 1px 2px rgba(26, 31, 54, 0.04),
          0 1px 3px rgba(26, 31, 54, 0.06);
        overflow: hidden;
      }
      .card:hover {
        box-shadow: 0 2px 8px rgba(26, 31, 54, 0.1);
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 8px 0 0 8px;
      }
      .card.match::before {
        background: var(--green-line);
      }
      .card.over::before {
        background: var(--amber-line);
      }
      .card.bail::before {
        background: var(--rose-line);
      }
      .card.cont::before {
        background: var(--ink-ghost);
      }
      .card.term::before {
        background: var(--ink-ghost);
      }
      .card.terminal {
        background: var(--bg-soft);
      }
      .card.fallback {
        background: var(--amber-bg);
        border-color: var(--amber-line);
      }
      .card.cempty {
        background: var(--rose-bg);
        border-color: var(--rose-line);
      }
      .card.likely {
        background: #fdf8e3;
        border-color: #ead9a6;
      }
      .card.likely.terminal {
        background: #faf2d0;
      }
      .ctext[contenteditable="true"] {
        outline: none;
        border-radius: 4px;
        transition: background 100ms, box-shadow 100ms;
        cursor: text;
      }
      .ctext[contenteditable="true"]:hover {
        background: var(--rule-soft);
      }
      .ctext[contenteditable="true"]:focus {
        background: #fff;
        box-shadow: 0 0 0 2px var(--accent);
      }
      .ctext.edited {
        position: relative;
      }
      .ctext.edited::after {
        content: "edited";
        position: absolute;
        top: -7px;
        right: -4px;
        font-size: 8px;
        font-family: var(--sans);
        font-style: normal;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent);
        background: #fff;
        padding: 1px 4px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        line-height: 1.2;
      }
      button.edits-btn {
        background: #63ad4250;
        border: 1px solid #d4cdff;
        color: var(--accent);
      }
      button.edits-btn:hover {
        background: #e9e5ff;
      }
      button.edits-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .ckind {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ink-faint);
        flex-shrink: 0;
      }
      .ckind.match {
        color: var(--green);
      }
      .ckind.over {
        color: var(--amber);
      }
      .ckind.bail {
        color: var(--rose);
      }
      .ckind.cont {
        color: var(--teal);
      }
      .cdeck {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        text-align: right;
      }
      .cspk {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ink-faint);
      }
      .cspk.npc {
        color: var(--teal);
      }
      .cspk.player {
        color: var(--green);
      }
      .ctext {
        font-family: var(--serif);
        font-size: 16px;
        line-height: 1.45;
        color: var(--ink);
        word-break: break-word;
      }
      .card.terminal .ctext {
        font-size: 15px;
        color: var(--ink-soft);
      }
      .card.cempty .ctext {
        color: var(--rose);
        font-style: italic;
        font-size: 14px;
      }
      .ctext .pause {
        display: inline-block;
        color: var(--ink-faint);
        font-size: 0.5em;
        letter-spacing: 0.15em;
        vertical-align: middle;
        margin: 0 4px;
        padding: 2px 6px;
        background: var(--rule-soft);
        border-radius: 999px;
        line-height: 1;
        position: relative;
        top: -0.1em;
      }
      .ctext .consent {
        display: block;
        color: var(--ink-soft);
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--rule-soft);
        font-size: 14px;
      }
      .ctext.consent-line {
        margin-top: 0;
        padding: 0;
      }
      .outcome {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 4px;
        align-self: flex-start;
        font-weight: 500;
      }
      .outcome.joined {
        color: var(--green);
        background: var(--green-bg);
      }
      .outcome.declined {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .outcome.narc {
        color: var(--rose);
        background: var(--rose-bg);
      }
      .outcome.backed {
        color: var(--ink-soft);
        background: var(--rule-soft);
      }
      .outcome.deferred {
        color: var(--teal);
        background: var(--teal-bg);
      }
      .outcome.narc_avoided {
        color: var(--green);
        background: var(--green-bg);
      }
      .carousel {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-top: 7px;
        border-top: 1px solid var(--rule-soft);
      }
      .carr {
        background: var(--bg-card);
        border: 1px solid var(--rule);
        color: var(--ink-soft);
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        flex-shrink: 0;
      }
      .carr:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .carr:not(:disabled):hover {
        border-color: var(--ink-soft);
        color: var(--ink);
      }
      .cpos {
        font-size: 11px;
        font-family: var(--mono);
        color: var(--ink-soft);
        flex-shrink: 0;
      }
      .ctags {
        font-size: 10px;
        font-family: var(--mono);
        color: var(--teal);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-left: auto;
      }
      .ctags.fallback {
        color: var(--amber);
      }
      .ctags.cempty {
        color: var(--rose);
      }

      .empty-state {
        color: var(--ink-soft);
        text-align: center;
        padding: 60px 20px;
        font-size: 15px;
        font-family: var(--serif);
        font-style: italic;
      }
      .empty-state strong {
        font-style: normal;
        color: var(--ink);
      }
      #error-box {
        background: var(--rose-bg);
        border: 1px solid var(--rose-line);
        color: var(--rose);
        padding: 12px 16px;
        border-radius: 7px;
        margin: 16px 20px;
        font-family: var(--mono);
        font-size: 11px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="error-box"></div>
    <div class="ctrl-wrap">
      <h1>Dialogue review</h1>
      <div class="controls">
        <select id="tagSel"></select>
        <button onclick="randomTag()">random</button>
        <button class="sec" onclick="prevTag()">◀</button>
        <button class="sec" onclick="nextTag()">▶</button>
        <button class="sec" id="walkBtn" onclick="walkAllTags()">▶▶ walk</button>
        <span class="sep"></span>
        <span class="pills" id="npcPills"></span>
        <span class="pos" id="tagPos"></span>
        <span class="sep"></span>
        <button class="export-btn" onclick="exportCurrentTagTXT()">⬇ dl this tree</button>
        <button class="export-btn" onclick="exportAllTagsTXT()">⬇⬇ dl all trees</button>
        <button class="edits-btn" id="editsBtn" onclick="exportEdits()">copy/download all edits</button>
        <button class="sec" id="resetBtn" onclick="resetEdits()">reset (DANGER)</button>
        <span class="sep"></span>
        <button class="sec" id="langBtn" onclick="toggleLang()">FR</button>
      </div>
      
    </div>
    <div id="tag-hdr"></div>
    <div id="canvas-wrap">
      <div id="tree-area"><svg id="conn-svg" style="position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible"></svg></div>
    </div>

    <script src="game-data.js"></script>
    <script src="game-data-words-engine.js"></script>
    <script>
      (function () {
        var lang = "en";
        try {
          lang = localStorage.getItem("tw_lang") || "en";
        } catch (e) {}
        var file = lang === "fr" ? "game-data-words-fr.js" : "game-data-words.js";
        document.write('<script src="' + file + '"><\/script>');
      })();
    </script>
    <script>
      /* stubs */
      window.GAME_DATA = window.GAME_DATA || {
        buildings: [],
        playerArt: [[" @ "], [" @ "]],
        npcArts: [["&"]],
        npcColors: ["#aaa"],
        narcArt: ["%"],
        robinArt: ["R"],
        narrativeQuotes: [],
      };
      const _n = () => {};
      window.audio = { play: _n };
      window.grid = { set: _n, text: _n, textCenter: _n, art: _n };
      window.Util = window.Util || {
        pick: (a) => a[Math.floor(Math.random() * a.length)],
        clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
        randInt: (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
        lerp: (a, b, t) => a + (b - a) * t,
      };
      window.phase = "tester";
      window.W = 80;
      window.H = 30;
      window.dialogStack = [];
      ["C_PLAYER", "C_DIM", "C_DANGER", "C_SUCCESS", "C_TEAL", "C_ORANGE", "C_WARN"].forEach((k) => (window[k] = "#888"));
      window.bannerTimer = 0;
      window.hasPlayed = false;
      [
        "showBanner",
        "updateBanner",
        "renderBanner",
        "dialogUpdate",
        "dialogRender",
        "addFloat",
        "spark",
        "triggerChromatic",
        "endGame",
        "initAct2b",
      ].forEach((k) => (window[k] = _n));
      window.hudLabel = { textContent: "" };
      window.hudScore = { textContent: "", style: {} };
      window.hudStatus = { textContent: "", style: {} };
      if (!document.getElementById("gamescreen")) {
        const c = document.createElement("canvas");
        c.id = "gamescreen";
        c.style.display = "none";
        document.body.appendChild(c);
      }
      window.gs = document.getElementById("gamescreen");
      window.input = { isDown: _n, justPressed: _n };
      window.clickPending = false;
      window.CONV_BOX = window.DIALOG_BOX = { tl: "+", tr: "+", bl: "+", br: "+", h: "-", v: "|" };
      window.A1_LOOP_MSGS = [];
      window.HA = [[""]];
      window.HC = ["#fff"];
    </script>
    <script>
      const esc = (s) =>
        String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      const f = (n) => Math.round(n * 10) / 10;

      /* ── edit store: maps original card text → user's replacement.
         Keyed on the ORIGINAL text so the same card edited anywhere stays
         consistent, and so export is a clean old→new list. Per-language. ── */
      const EDIT_KEY = () => "tw_edits_" + curLang;
      let edits = {};
      function loadEdits() {
        try {
          edits = JSON.parse(localStorage.getItem(EDIT_KEY()) || "{}") || {};
        } catch (e) {
          edits = {};
        }
      }
      function saveEdits() {
        try {
          localStorage.setItem(EDIT_KEY(), JSON.stringify(edits));
        } catch (e) {}
      }
      /** The text to display for an original string: the edit if one exists,
          else the original. */
      const displayText = (orig) => (orig != null && edits[orig] != null ? edits[orig] : orig);

      /** Source ⇄ editor conversions.
          In storage, card text uses REAL newline chars and literal "|pause|".
          In the editor we show newlines as the two visible characters \n so
          the user can edit the markers directly, matching their source file. */
      const toEditable = (s) => String(s ?? "").replace(/\r\n/g, "\n").replace(/\n/g, "\\n");
      const fromEditable = (s) => String(s ?? "").replace(/\\n/g, "\n");
      /** Record (or clear) an edit. If newText equals original, delete it. */
      function setEdit(orig, newText) {
        if (orig == null) return;
        if (newText === orig || newText.trim() === "") {
          delete edits[orig];
        } else {
          edits[orig] = newText;
        }
        saveEdits();
        updateEditsBtn();
      }
      function editCount() {
        return Object.keys(edits).length;
      }
      function updateEditsBtn() {
        const n = editCount();
        const b = document.getElementById("editsBtn");
        if (b) {
          b.disabled = n === 0;
          b.textContent = n ? `✎ edits (${n})` : "✎ edits";
        }
        const r = document.getElementById("resetBtn");
        if (r) r.disabled = n === 0;
      }
      function resetEdits() {
        const n = editCount();
        if (!n) return;
        if (!confirm(`Discard all ${n} edit(s) for ${curLang.toUpperCase()}? This can't be undone.`)) return;
        edits = {};
        saveEdits();
        updateEditsBtn();
        renderForTag(allTags[curIdx], curKind);
      }

      /* ── deck helpers ── */
      const isTaggedDeck = (d) => {
        const s = d?.src;
        if (!s?.length) return false;
        return typeof s[0] !== "string";
      };
      const tagsOf = (c) => (!c || typeof c === "string" ? [] : c.tags || []);
      const textOf = (c) => (typeof c === "string" ? c : (c?.t ?? ""));

      let _DM = null;
      let curLang = "en";
      function toggleLang() {
        const next = curLang === "en" ? "fr" : "en";
        try {
          localStorage.setItem("tw_lang", next);
        } catch (e) {}
        location.reload();
      }
      function getDM() {
        if (_DM) return _DM;
        _DM = {};
        [
          ["DECK_GREET", () => DECK_GREET],
          ["DECK_ANGRY_HELLO", () => DECK_ANGRY_HELLO],
          ["DECK_HUNGRY_HELLO", () => DECK_HUNGRY_HELLO],
          ["DECK_NARC_HELLO", () => DECK_NARC_HELLO],
          ["DECK_ANGRY_PITCH", () => DECK_ANGRY_PITCH],
          ["DECK_HUNGRY_PITCH", () => DECK_HUNGRY_PITCH],
          ["DECK_NARC_AGREE", () => DECK_NARC_AGREE],
          ["DECK_BAD_READ", () => DECK_BAD_READ],
          ["DECK_FILLER", () => DECK_FILLER],
          ["DECK_F_INVITE", () => DECK_F_INVITE],
          ["DECK_STRONGER_PITCH", () => DECK_STRONGER_PITCH],
          ["DECK_SAY_MORE_WARM", () => DECK_SAY_MORE_WARM],
          ["DECK_SAY_MORE_SKEPTICAL", () => DECK_SAY_MORE_SKEPTICAL],
          ["DECK_BACK_OFF_EARLY", () => DECK_BACK_OFF_EARLY],
          ["DECK_BACK_OFF_LATE", () => DECK_BACK_OFF_LATE],
          ["DECK_BAIL_RESPONSE", () => DECK_BAIL_RESPONSE],
          ["DECK_JOIN_CONSENT", () => DECK_JOIN_CONSENT],
          ["DECK_NO_BYE", () => DECK_NO_BYE],
          ["DECK_NOT_NOW", () => DECK_NOT_NOW],
          ["DECK_RETURN", () => DECK_RETURN],
          ["DECK_NARC_REV", () => DECK_NARC_REV],
          ["DECK_MISMATCH_TOO_LITERAL", () => DECK_MISMATCH_TOO_LITERAL],
          ["DECK_MISMATCH_TOO_STRUCTURAL", () => DECK_MISMATCH_TOO_STRUCTURAL],
        ].forEach(([n, f]) => {
          try {
            const v = f();
            if (v) _DM[n] = v;
          } catch (e) {}
        });
        return _DM;
      }
      const getDeck = (n) => getDM()[n] || null;

      /* ── prefix pool enumeration ── */

      const ALL_DECKS = [
        "DECK_GREET",
        "DECK_ANGRY_HELLO",
        "DECK_HUNGRY_HELLO",
        "DECK_NARC_HELLO",
        "DECK_ANGRY_PITCH",
        "DECK_HUNGRY_PITCH",
        "DECK_NARC_AGREE",
        "DECK_BAD_READ",
        "DECK_FILLER",
        "DECK_F_INVITE",
        "DECK_STRONGER_PITCH",
        "DECK_SAY_MORE_WARM",
        "DECK_SAY_MORE_SKEPTICAL",
        "DECK_BACK_OFF_EARLY",
        "DECK_BACK_OFF_LATE",
        "DECK_BAIL_RESPONSE",
        "DECK_JOIN_CONSENT",
        "DECK_NO_BYE",
        "DECK_NOT_NOW",
        "DECK_RETURN",
        "DECK_NARC_REV",
        "DECK_MISMATCH_TOO_LITERAL",
        "DECK_MISMATCH_TOO_STRUCTURAL",
      ];

      function collectAllTags() {
        const s = new Set();
        for (const n of ALL_DECKS) {
          const d = getDeck(n);
          if (!d?.src) continue;
          for (const c of d.src) for (const t of tagsOf(c)) if (t) s.add(t);
        }
        return [...s].sort();
      }

      function resolvePool(name, tags) {
        const d = getDeck(name);
        if (!d?.src) return { cards: [], mode: "empty" };
        const src = d.src;
        if (!isTaggedDeck(d)) return { cards: src.slice(), mode: "untagged" };
        if (!tags?.length) return { cards: src.slice(), mode: "tagged" };
        const m = src.filter((c) => tagsOf(c).some((t) => tags.includes(t)));
        if (!m.length) return { cards: src.slice(), mode: "fallback" };
        return { cards: m, mode: "tagged" };
      }
      const helloHasTag = (kind, tag) => {
        const n = kind === "narc" ? "DECK_NARC_HELLO" : kind === "angry" ? "DECK_ANGRY_HELLO" : "DECK_HUNGRY_HELLO";
        return getDeck(n)?.src.some((c) => tagsOf(c).includes(tag)) ?? false;
      };
      const bestKind = (tag) => ["angry", "hungry", "narc"].find((k) => helloHasTag(k, tag)) || "angry";

      /* ── tree model ── */
      function mkNode(kind, speaker, deckName, matchTags, extra = {}) {
        const { cards, mode } = resolvePool(deckName, matchTags);
        return { kind, speaker, deckName, pool: cards, mode, matchTags, children: [], ...extra };
      }
      const ptags = (n) => tagsOf(n.pool?.[0]);

      function buildTree(tag, npcKind) {
        const isNarc = npcKind === "narc";
        // Greets eligible for this tag: untagged greets always work,
        // tagged greets only if they share the tag.
        const greetDeck = getDeck("DECK_GREET");
        const eligibleGreetCards = greetDeck?.src.filter((g) => {
          const gt = tagsOf(g);
          return gt.length === 0 || gt.includes(tag);
        }) ?? [];
        const greet = {
          kind: "cont",
          speaker: "player",
          deckName: "DECK_GREET",
          pool: eligibleGreetCards,
          mode: eligibleGreetCards.length ? "tagged" : "empty",
          matchTags: [tag],
          children: [],
          isGreet: true,
        };
        const hName = isNarc ? "DECK_NARC_HELLO" : npcKind === "angry" ? "DECK_ANGRY_HELLO" : "DECK_HUNGRY_HELLO";
        const hDeck = getDeck(hName);
        const hMatched = hDeck?.src.filter((c) => tagsOf(c).includes(tag)) ?? [];
        const hello = {
          kind: "cont",
          speaker: "npc",
          deckName: hName,
          pool: hMatched,
          mode: hMatched.length ? "tagged" : "empty",
          matchTags: [tag],
          children: [],
          npcFlavor: isNarc ? "narc" : null,
          isHello: true,
          npcKind,
        };
        greet.children = [{ lbl: "", node: hello }];
        if (!hMatched.length) return { hello: greet, available: false };

        const ht = ptags(hello);
        const pitchName = isNarc ? "DECK_NARC_AGREE" : npcKind === "angry" ? "DECK_ANGRY_PITCH" : "DECK_HUNGRY_PITCH";
        const matchN = mkNode("match", "player", pitchName, ht);
        const overN = mkNode("over", "player", "DECK_BAD_READ", ht);
        const bailN = mkNode("bail", "player", "DECK_BACK_OFF_EARLY", ht);

        // BAIL: narc bail is a good outcome (player smelled it)
        bailN.children = [
          {
            lbl: "",
            node: mkNode("term", "npc", "DECK_BAIL_RESPONSE", ptags(bailN), {
              outcome: isNarc ? "narc_avoided" : "backed",
            }),
          },
        ];

        // Mark the likely path: greet → hello → match → filler → invite → join
        // (and the say-more branch for non-narcs). Narc likely path is bail.
        greet.likely = true;
        hello.likely = true;

        if (isNarc) {
          bailN.likely = true;
          bailN.children[0].node.likely = true;
          // NARC MATCH: filler → INVITE reveals, WALK AWAY avoids.
          const fillerN = mkNode("cont", "npc", "DECK_FILLER", ptags(matchN));
          const ft = ptags(fillerN);
          const invN = mkNode("match", "player", "DECK_F_INVITE", ft);
          const walkN = mkNode("bail", "player", "DECK_BACK_OFF_EARLY", ft);
          invN.children = [
            {
              lbl: "",
              node: mkNode("term", "npc", "DECK_NARC_REV", ptags(invN), { outcome: "narc" }),
            },
          ];
          walkN.children = [
            {
              lbl: "",
              node: {
                kind: "term",
                speaker: null,
                deckName: "(no NPC reply)",
                pool: [],
                mode: "untagged",
                matchTags: [],
                children: [],
                outcome: "narc_avoided",
                silent: true,
              },
            },
          ];
          fillerN.children = [
            { lbl: "INVITE", node: invN },
            { lbl: "WALK AWAY", node: walkN },
          ];
          matchN.children = [{ lbl: "", node: fillerN }];

          // NARC TALK OVER: say_more_skeptical → STRONGER reveals, WALK AWAY avoids.
          const smN = mkNode("cont", "npc", "DECK_SAY_MORE_SKEPTICAL", ptags(overN));
          const smt = ptags(smN).length ? ptags(smN) : ptags(overN);
          const strN = mkNode("match", "player", "DECK_STRONGER_PITCH", smt);
          const lbN = mkNode("bail", "player", "DECK_BACK_OFF_LATE", smt);
          strN.children = [
            {
              lbl: "",
              node: mkNode("term", "npc", "DECK_NARC_REV", ptags(strN), { outcome: "narc" }),
            },
          ];
          lbN.children = [
            {
              lbl: "",
              node: {
                kind: "term",
                speaker: null,
                deckName: "(no NPC reply)",
                pool: [],
                mode: "untagged",
                matchTags: [],
                children: [],
                outcome: "narc_avoided",
                silent: true,
              },
            },
          ];
          smN.children = [
            { lbl: "STRONGER", node: strN },
            { lbl: "WALK AWAY", node: lbN },
          ];
          overN.children = [{ lbl: "", node: smN }];
        } else {
          // NON-NARC: TALK OVER mismatches and closes
          const mmN = mkNode("term", "npc", npcKind === "hungry" ? "DECK_MISMATCH_TOO_STRUCTURAL" : "DECK_MISMATCH_TOO_LITERAL", ptags(overN), {
            outcome: "declined",
          });
          const nb = resolvePool("DECK_NO_BYE", ptags(overN));
          mmN.followDeck = "DECK_NO_BYE";
          mmN.followPool = nb.cards;
          overN.children = [{ lbl: "", node: mmN }];

          // NON-NARC: MATCH → filler → invite → join-or-say-more
          const fillerN = mkNode("cont", "npc", "DECK_FILLER", ptags(matchN));
          const ft = ptags(fillerN);
          const invN = mkNode("match", "player", "DECK_F_INVITE", ft);
          const walkN = mkNode("bail", "player", "DECK_BACK_OFF_EARLY", ft);
          walkN.children = [{ lbl: "", node: mkNode("term", "npc", "DECK_BAIL_RESPONSE", ptags(walkN), { outcome: "backed" }) }];

          // Engine TP 144 has three outcomes off the invite:
          //   r < A2_MAYBE_LATER_CHANCE                              → NOT NOW
          //   else if (!hasSayMore || r < lateChance + 0.8*(1-late)) → JOIN
          //   else                                                   → SAY MORE
          const inviteTags = ptags(invN);
          const sayMoreDeck = getDeck("DECK_SAY_MORE_WARM");
          const hasWarmMatch = sayMoreDeck?.src.some((c) => tagsOf(c).some((t) => inviteTags.includes(t))) ?? false;

          const nnDirect = mkNode("cont", "npc", "DECK_NOT_NOW", inviteTags);
          const nnDirectTags = ptags(nnDirect).length ? ptags(nnDirect) : inviteTags;
          nnDirect.children = [
            {
              lbl: "(4-7s later)",
              node: mkNode("term", "npc", "DECK_RETURN", nnDirectTags, { outcome: "deferred" }),
            },
          ];

          const joinDirect = mkNode("term", "npc", "DECK_JOIN_CONSENT", inviteTags, { outcome: "joined" });
          joinDirect.likely = true;
          const sayMoreBranch = hasWarmMatch ? buildSayMore("DECK_SAY_MORE_WARM", inviteTags, npcKind) : null;
          if (sayMoreBranch) sayMoreBranch.likely = true;

          invN.children = hasWarmMatch
            ? [
                { lbl: "NOT NOW", node: nnDirect },
                { lbl: "JOIN", node: joinDirect },
                { lbl: "SAY MORE", node: sayMoreBranch },
              ]
            : [
                { lbl: "NOT NOW", node: nnDirect },
                { lbl: "JOIN", node: joinDirect },
              ];
          fillerN.children = [
            { lbl: "RECRUIT", node: invN },
            { lbl: "WALK AWAY", node: walkN },
          ];
          matchN.likely = true;
          fillerN.likely = true;
          invN.likely = true;
          matchN.children = [{ lbl: "", node: fillerN }];
        }

        hello.children = [
          { lbl: "MATCH", node: matchN },
          { lbl: "TALK OVER", node: overN },
          { lbl: "BAIL", node: bailN },
        ];
        return { hello: greet, available: true };
      }

      function buildSayMore(deckName, inputTags, npcKind) {
        const isNarc = npcKind === "narc";
        const smN = mkNode("cont", "npc", deckName, inputTags);
        const smt = ptags(smN).length ? ptags(smN) : inputTags;
        const strN = mkNode("match", "player", "DECK_STRONGER_PITCH", smt);
        const lbN = mkNode("bail", "player", "DECK_BACK_OFF_LATE", smt);
        lbN.children = [
          {
            lbl: "",
            node: {
              kind: "term",
              speaker: null,
              deckName: "(no NPC reply)",
              pool: [],
              mode: "untagged",
              matchTags: [],
              children: [],
              outcome: isNarc ? "narc_avoided" : "backed",
              silent: true,
            },
          },
        ];
        const st = ptags(strN).length ? ptags(strN) : smt;
        if (isNarc) {
          strN.children = [{ lbl: "", node: mkNode("term", "npc", "DECK_NARC_REV", st, { outcome: "narc" }) }];
        } else {
          const nnN = mkNode("cont", "npc", "DECK_NOT_NOW", st);
          const nnt = ptags(nnN).length ? ptags(nnN) : st;
          nnN.children = [{ lbl: "(4-7s later)", node: mkNode("term", "npc", "DECK_RETURN", nnt, { outcome: "deferred" }) }];
          const joinTerm = mkNode("term", "npc", "DECK_JOIN_CONSENT", st, { outcome: "joined" });
          joinTerm.likely = true;
          strN.likely = true;
          strN.children = [
            { lbl: "JOIN (60%)", node: joinTerm },
            { lbl: "NOT NOW (40%)", node: nnN },
          ];
        }
        smN.children = [
          { lbl: "STRONGER", node: strN },
          { lbl: "WALK AWAY", node: lbN },
        ];
        return smN;
      }

      /* ── LAYOUT ── */
      const CW = 220;
      const HPAD = 20;
      const VGAP = 88;

      function buildLayout(root) {
        const rows = [];
        const items = [];
        const itemByNode = new Map();

        // Pass 1: build the item tree. No positioning yet — just structure.
        function build(node, depth, parentItem, lbl) {
          const existing = itemByNode.get(node);
          if (existing) {
            // DAG: node has multiple parents. Promote to deeper depth.
            if (depth > existing.depth) {
              const oldRow = rows[existing.depth];
              if (oldRow) {
                const i = oldRow.indexOf(existing);
                if (i >= 0) oldRow.splice(i, 1);
              }
              existing.depth = depth;
              if (!rows[depth]) rows[depth] = [];
              rows[depth].push(existing);
            }
            existing.parents.push({ parentItem, lbl });
            if (parentItem) parentItem.children.push({ item: existing, lbl });
            return existing;
          }

          if (!rows[depth]) rows[depth] = [];
          const item = {
            node,
            depth,
            cx: 0, // assigned in pass 3
            subtreeW: 0, // assigned in pass 2
            parents: parentItem ? [{ parentItem, lbl }] : [],
            children: [],
            id: null,
            el: null,
          };
          rows[depth].push(item);
          items.push(item);
          itemByNode.set(node, item);
          if (parentItem) parentItem.children.push({ item, lbl });

          for (const c of node.children || []) {
            build(c.node, depth + 1, item, c.lbl);
          }
          return item;
        }
        const rootItem = build(root, 0, null, "");

        // Pass 2: compute subtree widths bottom-up.
        // A leaf's subtree width is CW. A parent's subtree width is the sum
        // of its children's subtree widths plus HPAD between each, but never
        // less than CW (so single tall columns still get min spacing).
        const sized = new Set();
        function size(item) {
          if (sized.has(item)) return item.subtreeW;
          sized.add(item);
          if (!item.children.length) {
            item.subtreeW = CW;
            return CW;
          }
          let total = 0;
          for (let i = 0; i < item.children.length; i++) {
            total += size(item.children[i].item);
            if (i > 0) total += HPAD;
          }
          item.subtreeW = Math.max(total, CW);
          return item.subtreeW;
        }
        size(rootItem);

        // Pass 3: place nodes top-down. Each node knows its own cx, and lays
        // out its children left-to-right across its subtree width, centered
        // under itself.
        const placed = new Set();
        function place(item) {
          if (placed.has(item)) return;
          placed.add(item);
          if (!item.children.length) return;

          // Total width occupied by children (their subtree widths + gaps).
          let totalChildW = 0;
          for (let i = 0; i < item.children.length; i++) {
            totalChildW += item.children[i].item.subtreeW;
            if (i > 0) totalChildW += HPAD;
          }

          // Start x is the left edge of the children block, centered under parent.
          let cursor = item.cx - totalChildW / 2;
          for (const c of item.children) {
            const ch = c.item;
            ch.cx = cursor + ch.subtreeW / 2;
            cursor += ch.subtreeW + HPAD;
            place(ch);
          }
        }
        rootItem.cx = 0;
        place(rootItem);

        // Pass 4: shift so the leftmost card sits at the left margin.
        // The root is already centered over its subtree by construction
        // (pass 3 places each parent at the midpoint of its children's block),
        // so this just translates the whole tree onto the canvas.
        let minLeft = Infinity;
        for (const it of items) minLeft = Math.min(minLeft, it.cx - CW / 2);
        const pad = 8 - minLeft;
        for (const it of items) it.cx += pad;

        return { items, rows };
      }

      /* ── RENDER ── */
      let nodeReg = new Map();
      let idCounter = 0;

      const rt = (t) =>
        t
          ? esc(t)
              .replace(/\n/g, "<br>")
              .replace(/\|pause\|/g, '<span class="pause">•••</span>')
          : "";

      function cardHTML(node, id) {
        const cls = ["card", node.kind];
        if (node.outcome) cls.push("terminal");
        if (node.mode === "fallback") cls.push("fallback");
        if (node.mode === "empty" && !node.silent) cls.push("cempty");
        if (node.likely) cls.push("likely");

        const card = node.pool?.[0];
        const kindLabel =
          { match: "MATCH", over: "TALK OVER", bail: "BAIL", cont: "•", term: node.outcome ? "▣ " + node.outcome.toUpperCase() : "▣" }[node.kind] ||
          "•";
        const spk = node.speaker ? (node.speaker === "npc" ? "NPC" : "PLAYER") : "—";
        const dk = node.deckName.replace(/^DECK_/, "").toLowerCase();

        let inner = `<div class="card-head">
    <span class="ckind ${node.kind}">${esc(kindLabel)}</span>
    <span class="cdeck" title="${esc(node.deckName)}">${esc(dk)}</span>
  </div>
  <div class="cspk ${node.speaker || ""}">${spk}</div>`;

        if (node.silent) {
          inner += `<div class="ctext" id="${id}-t" style="color:var(--ink-faint);font-style:italic">(no reply — float + close)</div>`;
        } else {
          const origT = card ? textOf(card) : "";
          const editable = !!card;
          const isEd = origT != null && edits[origT] != null;
          if (editable) {
            inner += `<div class="ctext editable${isEd ? " edited" : ""}" id="${id}-t" contenteditable="true" data-orig="${esc(origT)}" onfocus="onTextFocus('${id}')" onblur="onTextBlur('${id}')" onkeydown="onTextKey(event,'${id}')">${rt(displayText(origT))}</div>`;
            if (node.followPool?.length) {
              const fv = node.followPool[0];
              const fOrig = textOf(fv);
              const fEd = fOrig != null && edits[fOrig] != null;
              inner += `<div class="ctext consent-line"><span class="consent"><span class="ctext editable consent-edit${fEd ? " edited" : ""}" id="${id}-f" contenteditable="true" data-orig="${esc(fOrig)}" onfocus="onTextFocus('${id}-f')" onblur="onTextBlur('${id}-f')" onkeydown="onTextKey(event,'${id}-f')">${rt(displayText(fOrig))}</span> <span style="color:var(--ink-faint);font-size:.85em;font-family:var(--mono)">[${esc(node.followDeck)}]</span></span></div>`;
            }
          } else {
            inner += `<div class="ctext" id="${id}-t">${cardContent(card, node)}</div>`;
          }
        }

        if (node.outcome) inner += `<div class="outcome ${node.outcome}">${esc(olabel(node.outcome))}</div>`;

        if (!node.silent) {
          const tags = card ? tagsOf(card) : [];
          let tc = "",
            ts;
          if (node.mode === "untagged") ts = "(untagged)";
          else if (node.mode === "fallback") {
            tc = "fallback";
            ts = "⚠ fallback";
          } else if (node.mode === "empty") {
            tc = "cempty";
            ts = "(unavailable)";
          } else ts = tags.length ? "[" + tags.join(", ") + "]" : "(no tags)";
          const total = node.pool?.length || 0;
          inner += `<div class="carousel">
      <button class="carr" onclick="cycleN('${id}',-1)" ${total <= 1 ? "disabled" : ""}>◀</button>
      <span class="cpos" id="${id}-p">${total ? 1 : 0} / ${total}</span>
      <button class="carr" onclick="cycleN('${id}',1)" ${total <= 1 ? "disabled" : ""}>▶</button>
      <span class="ctags ${tc}" id="${id}-g" title="${esc(ts)}">${esc(ts)}</span>
    </div>`;
        }
        return `<div class="${cls.join(" ")}" id="${id}" style="width:${CW}px;position:absolute;top:-9999px;left:0">${inner}</div>`;
      }

      function cardContent(card, node) {
        if (!card) return "";
        let h = "";
        h += rt(displayText(textOf(card)));
        if (node.followPool?.length) {
          const fv = node.followPool[0];
          h += `<span class="consent">${rt(textOf(fv))} <span style="color:var(--ink-faint);font-size:.85em;font-family:var(--mono)">[${esc(node.followDeck)}]</span></span>`;
        }
        return h;
      }

      function onTextFocus(id) {
        const el = document.getElementById(id + "-t");
        if (!el) return;
        const orig = el.getAttribute("data-orig");
        // On focus, reveal the literal source form (visible \n and |pause|).
        el.textContent = toEditable(displayText(orig));
      }
      function onTextBlur(id) {
        const el = document.getElementById(id + "-t");
        if (!el) return;
        const orig = el.getAttribute("data-orig");
        // Read literal source back, strip any accidental real newlines, store.
        const literal = el.innerText.replace(/\u00a0/g, " ").replace(/\n/g, "").trimEnd();
        const newText = fromEditable(literal);
        setEdit(orig, newText);
        if (newText !== orig && newText.trim() !== "") {
          el.classList.add("edited");
        } else {
          el.classList.remove("edited");
        }
        // Re-render: show the rendered form (real breaks, |pause| dots).
        el.innerHTML = rt(displayText(orig));
      }
      function onTextKey(e, id) {
        if (e.key === "Enter") {
          // Newlines are edited as the literal characters \n, so a real
          // line break is never wanted here — Enter commits the edit.
          e.preventDefault();
          e.target.blur();
        } else if (e.key === "Escape") {
          e.preventDefault();
          const el = document.getElementById(id + "-t");
          const orig = el.getAttribute("data-orig");
          el.innerText = toEditable(displayText(orig));
          el.blur();
        }
      }

      function olabel(o) {
        return (
          {
            joined: "✓ joined",
            declined: "✗ declined",
            narc: "⚠ narc revealed",
            backed: "→ backed off",
            deferred: "~ deferred (4-7s)",
            narc_avoided: "✓ narc avoided",
          }[o] || o
        );
      }

      function cycleN(id, dir) {
        const e = nodeReg.get(id);
        if (!e) return;
        const tot = e.node.pool?.length || 0;
        if (tot <= 1) return;
        e.idx = (e.idx + dir + tot) % tot;
        const card = e.node.pool[e.idx];
        const t = document.getElementById(id + "-t");
        const p = document.getElementById(id + "-p");
        const g = document.getElementById(id + "-g");
        if (t) {
          const orig = textOf(card);
          if (t.classList.contains("editable")) {
            t.innerHTML = rt(displayText(orig));
            t.setAttribute("data-orig", orig);
            t.classList.toggle("edited", orig != null && edits[orig] != null);
          } else {
            t.innerHTML = cardContent(card, e.node);
          }
        }
        if (p) p.textContent = e.idx + 1 + " / " + tot;
        if (g && e.node.mode === "tagged") {
          const tags = tagsOf(card);
          const s = tags.length ? "[" + tags.join(", ") + "]" : "(no tags)";
          g.textContent = s;
          g.title = s;
        }
      }

      function renderTree(root) {
        const area = document.getElementById("tree-area");
        nodeReg = new Map();
        idCounter = 0;
        area.innerHTML = '<svg id="conn-svg" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible;"></svg>';
        const svg = document.getElementById("conn-svg");

        const { items, rows } = buildLayout(root);

        for (const item of items) {
          const id = "n" + idCounter++;
          item.id = id;
          nodeReg.set(id, { node: item.node, idx: 0 });
          const wrap = document.createElement("div");
          wrap.innerHTML = cardHTML(item.node, id);
          item.el = wrap.firstChild;
          area.appendChild(item.el);
        }

        requestAnimationFrame(() => {
          const rowH = rows.map((row) => (row ? Math.max(...row.map((i) => i.el?.offsetHeight || 100)) : 0));

          const rowY = [];
          let y = 0;
          for (let d = 0; d < rows.length; d++) {
            rowY[d] = y;
            y += rowH[d] + VGAP;
          }

          for (const item of items) {
            const cardLeft = item.cx - CW / 2;
            item.el.style.left = cardLeft + "px";
            item.el.style.top = rowY[item.depth] + "px";
            item.cardCx = item.cx;
            item.cardTop = rowY[item.depth];
            item.cardBot = rowY[item.depth] + (item.el.offsetHeight || 100);
          }

          const totalW = Math.max(...items.map((i) => i.cx + CW / 2)) + 20;
          const totalH = y + 20;
          area.style.width = totalW + "px";
          area.style.height = totalH + "px";
          svg.style.width = totalW + "px";
          svg.style.height = totalH + "px";
          svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);

          // Edge color picked by the originating parent's kind so each
          // branch can be traced visually even when lines cross columns.
          const STROKE_BY_KIND = {
            match: "#7fb89a", // green-ish (match path)
            over: "#d4b870", // amber-ish (talk over)
            bail: "#d49a9a", // rose-ish  (bail)
            cont: "#9ab4c4", // teal-ish  (NPC continuation)
            term: "#b8c0cc", // neutral
          };
          const strokeFor = (item) => STROKE_BY_KIND[item.node.kind] || "#b8c0cc";

          let s = "";

          for (const item of items) {
            if (!item.children.length) continue;
            const stroke = strokeFor(item);
            const px = f(item.cardCx);
            const py = f(item.cardBot);

            if (item.children.length === 1) {
              const ch = item.children[0].item;
              const lbl = (item.children[0].lbl || "").toUpperCase();
              const cx = f(ch.cardCx);
              const cy = f(ch.cardTop);
              const my = f(item.cardBot + (ch.cardTop - item.cardBot) * 0.6);
              s += `<path d="M${px},${py} V${my} H${cx} V${cy}" fill="none" stroke="${stroke}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
              if (lbl) {
                s += `<text x="${cx}" y="${f(parseFloat(my) - 7)}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#8792a2" letter-spacing="0.8">${esc(lbl)}</text>`;
              }
            } else {
              const jy = f(item.cardBot + VGAP * 0.65);
              s += `<line x1="${px}" y1="${py}" x2="${px}" y2="${jy}" stroke="${stroke}" stroke-width="3.5" stroke-linecap="round"/>`;
              const xs = item.children.map((c) => f(c.item.cardCx));
              const allXs = [...xs, px];
              s += `<line x1="${Math.min(...allXs)}" y1="${jy}" x2="${Math.max(...allXs)}" y2="${jy}" stroke="${stroke}" stroke-width="3.5" stroke-linecap="round"/>`;
              for (const c of item.children) {
                const ch = c.item;
                const cx = f(ch.cardCx);
                s += `<line x1="${cx}" y1="${jy}" x2="${cx}" y2="${f(ch.cardTop)}" stroke="${stroke}" stroke-width="3.5" stroke-linecap="round"/>`;
                if (c.lbl) {
                  s += `<text x="${cx}" y="${f(parseFloat(jy) - 7)}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#8792a2" letter-spacing="0.8">${esc(c.lbl.toUpperCase())}</text>`;
                }
              }
            }
          }
          svg.innerHTML = s;
        });
      }

      /* ── page logic ── */
      let allTags = [],
        curIdx = 0,
        curKind = "angry";

      function renderForTag(tag, kind) {
        const result = buildTree(tag, kind);
        const avail = { angry: helloHasTag("angry", tag), hungry: helloHasTag("hungry", tag), narc: helloHasTag("narc", tag) };
        const aKinds = Object.entries(avail)
          .filter(([, v]) => v)
          .map(([k]) => k);
        const aStr = aKinds.length ? "available for: " + aKinds.join(", ") : "no NPC kind has a hello tagged with this";

        const pills = ["angry", "hungry", "narc"]
          .map((k) => {
            const cls = ["pill"];
            if (k === kind) cls.push("active");
            if (!avail[k]) cls.push("disabled");
            return `<span class="${cls.join(" ")}">${k}</span>`;
          })
          .join("");

        document.getElementById("npcPills").innerHTML = pills;
        document.getElementById("tagPos").textContent = `${curIdx + 1} / ${allTags.length}`;
        document.getElementById("tag-hdr").innerHTML = "";

        const wrap = document.getElementById("canvas-wrap");
        if (!result.available) {
          wrap.innerHTML = `<div class="empty-state">no <strong>${esc(kind)}</strong> hello has tag <strong>${esc(tag)}</strong>.<br>${esc(aStr)}</div>`;
          return;
        }
        wrap.innerHTML = `<div id="tree-area"><svg id="conn-svg" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible;"></svg></div>`;
        renderTree(result.hello);
      }

      function setKind(k) {
        curKind = k;
        try {
          localStorage.setItem("tw_kind", k);
        } catch (e) {}
        renderForTag(allTags[curIdx], k);
      }
      function goTo(idx) {
        curIdx = idx;
        const tag = allTags[idx];
        if (!helloHasTag(curKind, tag)) {
          curKind = bestKind(tag);
        }
        document.getElementById("tagSel").value = tag;
        try {
          localStorage.setItem("tw_tag", tag);
          localStorage.setItem("tw_kind", curKind);
        } catch (e) {}
        renderForTag(tag, curKind);
      }
      function nextTag() {
        if (allTags.length) goTo((curIdx + 1) % allTags.length);
      }
      function prevTag() {
        if (allTags.length) goTo((curIdx - 1 + allTags.length) % allTags.length);
      }
      function randomTag() {
        if (!allTags.length) return;
        let n;
        do {
          n = Math.floor(Math.random() * allTags.length);
        } while (n === curIdx && allTags.length > 1);
        goTo(n);
      }

      let walkH = null;
      function walkAllTags() {
        const btn = document.getElementById("walkBtn");
        if (walkH) {
          clearInterval(walkH);
          walkH = null;
          btn.textContent = "▶▶ walk all";
          return;
        }
        btn.textContent = "■ stop";
        walkH = setInterval(() => {
          nextTag();
          if (curIdx === 0) {
            clearInterval(walkH);
            walkH = null;
            btn.textContent = "▶▶ walk all";
          }
        }, 3000);
        nextTag();
      }

      /* ════════════════════════════════════════════════════════════════
   EXPORT — enumerate all root-to-leaf paths, format as readable
   dialogue transcript, download as .txt
════════════════════════════════════════════════════════════════ */

      /**
       * Returns an array of paths, where each path is an array of
       * { node, inLabel } objects from root to leaf.
       */
      function enumeratePaths(root) {
        const paths = [];
        function walk(node, inLabel, steps) {
          const newSteps = [...steps, { node, inLabel }];
          if (!node.children || node.children.length === 0) {
            paths.push(newSteps);
            return;
          }
          for (const child of node.children) walk(child.node, child.lbl || "", newSteps);
        }
        walk(root, "", []);
        return paths;
      }

      /** Plain text of a card (no HTML). */
      function plainCardText(card) {
        if (!card) return "(unavailable)";
        return textOf(card).replace(/\|pause\|/g, "…");
      }

      /** Word-wrap a string to maxWidth, indenting continuation lines. */
      function wrapText(text, maxWidth, hangIndent) {
        const words = text.split(/\s+/).filter(Boolean);
        const lines = [];
        let line = "";
        for (const w of words) {
          if (line && line.length + 1 + w.length > maxWidth) {
            lines.push(line);
            line = hangIndent + w;
          } else {
            line = line ? line + " " + w : w;
          }
        }
        if (line) lines.push(line);
        return lines.join("\n");
      }

      /** Format one path (array of {node,inLabel}) as a readable script block. */
      function formatOnePath(steps, pathIdx, totalPaths) {
        const BAR = "═".repeat(64);
        const lines = [];

        // Path header: collect non-empty edge labels
        const edgeLabels = steps.map((s) => s.inLabel).filter(Boolean);
        const pathDesc = edgeLabels.length ? edgeLabels.join(" → ") : "direct";
        const lastNode = steps[steps.length - 1].node;
        const outcomeSuffix = lastNode.outcome ? `  [${olabel(lastNode.outcome).toUpperCase()}]` : "";

        lines.push(BAR);
        lines.push(`PATH ${pathIdx + 1} / ${totalPaths}:  ${pathDesc}${outcomeSuffix}`);
        lines.push(BAR);
        lines.push("");

        for (const { node } of steps) {
          // Silent terminal (player walked away late — no NPC reply)
          if (node.silent) {
            lines.push("  ( NPC does not reply — floats away )");
            lines.push("");
            continue;
          }

          const card = node.pool?.[0];

          // Nodes with no speaker (shouldn't happen but guard anyway)
          if (!node.speaker) {
            if (node.outcome) lines.push(`  ▸ ${olabel(node.outcome).toUpperCase()}`);
            lines.push("");
            continue;
          }

          const spkLabel = node.speaker === "npc" ? "NPC   " : "PLAYER";
          const indent = " ".repeat(spkLabel.length + 2); // "NPC   : " = 8 chars
          const rawText = card ? plainCardText(card, node) : "(no card — unavailable)";
          const wrapped = wrapText(rawText, 70, indent);

          lines.push(`${spkLabel}: ${wrapped}`);

          // Follow-up consent line attached to some terminal nodes
          if (node.followPool?.length) {
            const followText = textOf(node.followPool[0]).replace(/\|pause\|/g, "…");
            const wrappedFollow = wrapText(followText, 68, indent + "  ");
            lines.push(`${indent}[ ${wrappedFollow} ]`);
          }

          if (node.outcome) {
            lines.push("");
            lines.push(`  ▸ ${olabel(node.outcome).toUpperCase()}`);
          }

          lines.push("");
        }

        return lines.join("\n");
      }

      /** True if a path contains any node whose pool is untagged or fallback
       *  (meaning the card shown is generic and will repeat across tags).
       *  Silent terminals and outcome-only nodes don't count. */
      function pathHasOnlyTaggedContent(steps) {
        for (const { node } of steps) {
          if (node.silent) continue;
          if (!node.pool || !node.pool.length) continue;
          if (node.mode === "fallback") return false; // only skip true fallbacks
        }
        return true;
      }

      /** Export every tag × every available NPC kind into one big .txt.
       *  Skips paths whose content is only generic/fallback (repeats). */
      function exportAllTagsTXT() {
        const KINDS = ["angry", "hungry", "narc"];
        const now = new Date().toLocaleString("en-CA", { hour12: false }).replace(",", "");

        const sections = [];
        let totalPaths = 0;
        let skippedPaths = 0;
        let tagKindCount = 0;

        for (const tag of allTags) {
          for (const kind of KINDS) {
            if (!helloHasTag(kind, tag)) continue;
            const result = buildTree(tag, kind);
            if (!result.available) continue;
            tagKindCount++;

            const allPaths = enumeratePaths(result.hello);
            const keptPaths = allPaths.filter(pathHasOnlyTaggedContent);
            skippedPaths += allPaths.length - keptPaths.length;
            totalPaths += keptPaths.length;

            const sectionLines = [];
            sectionLines.push("");
            sectionLines.push("█".repeat(64));
            sectionLines.push(`  TAG: ${tag}    NPC: ${kind}    (${keptPaths.length} of ${allPaths.length} paths)`);
            sectionLines.push("█".repeat(64));
            sectionLines.push("");

            if (!keptPaths.length) {
              sectionLines.push("  (all paths use generic/fallback content — skipped)");
              sectionLines.push("");
            } else {
              const blocks = keptPaths.map((steps, i) => formatOnePath(steps, i, keptPaths.length));
              sectionLines.push(blocks.join("\n\n"));
            }

            sections.push(sectionLines.join("\n"));
          }
        }

        const headerLines = [
          "TAG WALKER — ALL DIALOGUE EXPORT",
          "═".repeat(64),
          `Language:       ${curLang.toUpperCase()}`,
          `Exported:       ${now}`,
          `Tags:           ${allTags.length}`,
          `Tag × NPC sets: ${tagKindCount}`,
          `Paths shown:    ${totalPaths}`,
          `Paths skipped:  ${skippedPaths}  (used untagged/fallback content)`,
          "═".repeat(64),
          "",
          "Only paths where every card came from a genuine tag-match are shown.",
          "Paths that fell back to generic pools are omitted to avoid repetition.",
          "",
        ];

        const full = headerLines.join("\n") + sections.join("\n");

        const blob = new Blob([full], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `dialogue-ALL-${curLang}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /** Export all user edits as an old→new find-and-replace list. */
      function exportEdits() {
        const keys = Object.keys(edits);
        if (!keys.length) {
          alert("No edits yet. Click any line of dialogue to edit it.");
          return;
        }
        const lines = [];
        lines.push("Replacements: the original line is followed by the replacement.");
        lines.push("");
        keys.forEach((orig) => {
          lines.push(toEditable(orig));
          lines.push(toEditable(edits[orig]));
          lines.push("");
        });
        const full = lines.join("\n").trimEnd() + "\n";

        const blob = new Blob([full], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `edits-${curLang}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        navigator.clipboard?.writeText(full).then(
          () => alert(`${keys.length} edit(s) copied to clipboard and downloaded.`),
          () => {}
        );
      }

      /** Main export entry point — called by the button. */
      function exportCurrentTagTXT() {
        const tag = allTags[curIdx];
        const kind = curKind;

        const result = buildTree(tag, kind);
        if (!result.available) {
          alert(`No ${kind} hello has tag "${tag}" — nothing to export.`);
          return;
        }

        const paths = enumeratePaths(result.hello);
        const now = new Date().toLocaleString("en-CA", { hour12: false }).replace(",", "");

        const headerLines = [
          "TAG WALKER — DIALOGUE EXPORT",
          "═".repeat(64),
          `Tag:      ${tag}`,
          `NPC kind: ${kind}`,
          `Exported: ${now}`,
          `Paths:    ${paths.length}`,
          "═".repeat(64),
          "",
          "Each PATH block shows one complete conversation from greeting",
          "to outcome. Cards shown are the first tagged match for this tag.",

          "",
          "",
        ];

        const blocks = paths.map((steps, i) => formatOnePath(steps, i, paths.length));
        const full = headerLines.join("\n") + blocks.join("\n\n");

        const blob = new Blob([full], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `dialogue-${tag}-${kind}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        navigator.clipboard?.writeText(full).catch(() => {});
      }

      function boot() {
        try {
          allTags = collectAllTags().filter((t) => ["angry", "hungry", "narc"].some((k) => helloHasTag(k, t)));
          loadEdits();
          updateEditsBtn();

          if (!allTags.length) {
            document.getElementById("canvas-wrap").innerHTML = `<div class="empty-state">no tagged cards found</div>`;
            return;
          }
          const sel = document.getElementById("tagSel");
          sel.innerHTML = allTags.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
          sel.addEventListener("change", (e) => {
            const i = allTags.indexOf(e.target.value);
            if (i >= 0) goTo(i);
          });
          document.addEventListener("keydown", (e) => {
            const ae = document.activeElement;
            if (ae?.tagName === "SELECT" || ae?.tagName === "INPUT" || ae?.isContentEditable) return;
            if (e.key === "ArrowRight") {
              nextTag();
              e.preventDefault();
            } else if (e.key === "ArrowLeft") {
              prevTag();
              e.preventDefault();
            } else if (e.key === "r" || e.key === "R") {
              randomTag();
              e.preventDefault();
            }
          });

          try {
            const savedLang = localStorage.getItem("tw_lang");
            if (savedLang === "fr" || savedLang === "en") {
              curLang = savedLang;
            }
            document.getElementById("langBtn").textContent = curLang === "en" ? "FR" : "EN";
          } catch (e) {}

          const savedTag = (() => {
            try {
              return localStorage.getItem("tw_tag");
            } catch (e) {
              return null;
            }
          })();
          const savedKind = (() => {
            try {
              return localStorage.getItem("tw_kind");
            } catch (e) {
              return null;
            }
          })();
          const savedIdx = savedTag ? allTags.indexOf(savedTag) : -1;
          const startIdx = savedIdx >= 0 ? savedIdx : 0;
          const startTag = allTags[startIdx];
          curKind = savedKind && ["angry", "hungry", "narc"].includes(savedKind) && helloHasTag(savedKind, startTag) ? savedKind : bestKind(startTag);
          goTo(startIdx);
        } catch (err) {
          const b = document.getElementById("error-box");
          b.style.display = "block";
          b.textContent = "error: " + err.message + "\n" + (err.stack || "");
        }
      }
      window.addEventListener("error", (e) => {
        const b = document.getElementById("error-box");
        b.style.display = "block";
        b.textContent = "error: " + e.message + " — " + e.filename + ":" + e.lineno;
      });
      if (document.readyState === "complete" || document.readyState === "interactive") setTimeout(boot, 0);
      else document.addEventListener("DOMContentLoaded", boot);
    </script>
  </body>
</html>
